<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nantes Météo &amp; Pollens Expert</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f1f3f4">
    <style>
        :root {
            --primary: #1a73e8;
            --bg: #f1f3f4;
            --card-bg: #ffffff;
            --text: #202124;
            --text-sec: #5f6368;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { width: 100%; max-width: 480px; }
        h1 { font-size: 22px; font-weight: 600; text-align: center; color: var(--primary); margin: 16px 0 20px 0; }
        
        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            margin-bottom: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border: 1px solid rgba(0,0,0,0.02);
        }
        .card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; border-bottom: 2px solid #f1f3f4; padding-bottom: 8px; }
        h2 { font-size: 14px; font-weight: 600; margin: 0; color: var(--text-sec); text-transform: uppercase; letter-spacing: 0.5px; }
        .card-icon { font-size: 18px; }

        .weather-main { text-align: center; padding: 28px 20px; background: linear-gradient(135deg, #e8f0fe 0%, #c2e7ff 100%); border: none; position: relative; overflow: hidden; }
        .weather-main .main-icon { font-size: 64px; margin-bottom: 8px; }
        .weather-main .temp { font-size: 44px; font-weight: 700; color: #041e49; margin: 4px 0; }
        .weather-main .desc { font-size: 15px; color: #041e49; font-weight: 500; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .grid .card { margin-bottom: 0; padding: 16px; border-radius: 18px; display: flex; flex-direction: column; justify-content: center; }
        .grid-value { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 6px; margin-top: 4px; }

        .data-row { display: flex; justify-content: space-between; align-items: center; margin: 14px 0; font-size: 15px; }
        .plant-name { display: flex; align-items: center; gap: 8px; }
        
        .risk-bar-container { width: 70px; background: #f1f3f4; height: 6px; border-radius: 3px; overflow: hidden; }
        .risk-bar { height: 100%; width: 0%; transition: width 0.5s ease; }

        .level-0 { background-color: #e8eaed; color: #5f6368; }
        .level-1 { background-color: #34a853; color: white; }
        .level-2 { background-color: #bccb10; color: #202124; }
        .level-3 { background-color: #fbbc04; color: #202124; }
        .level-4 { background-color: #e95420; color: white; }
        .level-5 { background-color: #ea4335; color: white; }
        
        .badge { padding: 4px 10px; border-radius: 12px; font-weight: 600; font-size: 12px; text-align: center; min-width: 60px; }
        .source-footer { font-size: 11px; color: var(--text-sec); text-align: center; margin-top: -6px; margin-bottom: 10px; font-style: italic; }
        
        .forecast-day { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f1f3f4; }
        .forecast-day:last-child { border-bottom: none; padding-bottom: 0; }

        .loader { text-align: center; color: var(--text-sec); font-style: italic; margin-top: 80px; }
    </style>
</head>
<body>

    <div class="container">
        <div id="loader" class="loader">Fusions des données Nantes Métropole, AirPL et RNSA...</div>

        <div id="app-content" style="display: none;">
            <!-- Météo Actuelle -->
            <div class="card weather-main">
                <div id="main-weather-icon" class="main-icon">☀️</div>
                <div class="temp" id="main-temp">--°C</div>
                <div class="desc" id="weather-desc">Chargement...</div>
            </div>

            <!-- Indicateurs secondaires (Vent & Air) -->
            <div class="grid">
                <div class="card">
                    <div class="card-header" style="margin-bottom:0; border:none; padding:0;">
                        <span class="card-icon">💨</span>
                        <h2>Vent</h2>
                    </div>
                    <div class="grid-value" id="sub-wind">-- km/h</div>
                </div>
                <div class="card">
                    <div class="card-header" style="margin-bottom:0; border:none; padding:0;">
                        <span class="card-icon">🫁</span>
                        <h2>Qualité Air</h2>
                    </div>
                    <div id="air-badge" class="badge level-0" style="margin-top: 6px; align-self: flex-start;">--</div>
                </div>
            </div>
            <div class="source-footer" id="air-source">Source : En attente...</div>

            <!-- Risques Pollens Robustes -->
            <div class="card">
                <div class="card-header">
                    <span class="card-icon">🌿</span>
                    <h2>Risques Allergiques</h2>
                </div>
                <div class="data-row">
                    <div class="plant-name"><span>🌳</span> <span>Bouleau (Betula)</span></div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div class="risk-bar-container"><div id="bar-bouleau" class="risk-bar"></div></div>
                        <span id="txt-bouleau" class="badge level-0">--</span>
                    </div>
                </div>
                <div class="data-row">
                    <div class="plant-name"><span>🌾</span> <span>Graminées</span></div>
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <div class="risk-bar-container"><div id="bar-graminees" class="risk-bar"></div></div>
                        <span id="txt-graminees" class="badge level-0">--</span>
                    </div>
                </div>
            </div>
            <div class="source-footer" id="pollen-source">Source : En attente...</div>

            <!-- Prévisions -->
            <div class="card">
                <div class="card-header">
                    <span class="card-icon">📅</span>
                    <h2>Prévisions Météo</h2>
                </div>
                <div id="forecast-container"></div>
            </div>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }

        const CONFIG = {
            lat: 47.2184,
            lon: -1.5536,
            nantesCommuneCode: "44109"
        };

        // Gestionnaire d'icônes et de descriptions météo complexes
        function getWeatherDetails(code) {
            const map = {
                0: { desc: "Ciel clair", icon: "☀️" },
                1: { desc: "Peu nuageux", icon: "🌤️" },
                2: { desc: "Partiellement nuageux", icon: "⛅" },
                3: { desc: "Couvert", icon: "☁️" },
                45: { desc: "Brouillard", icon: "🌫️" },
                48: { desc: "Brouillard givrant", icon: "🌫️" },
                51: { desc: "Bruine légère", icon: "🌦️" },
                53: { desc: "Bruine", icon: "🌦️" },
                55: { desc: "Bruine dense", icon: "🌧️" },
                61: { desc: "Pluie faible", icon: "🌦️" },
                63: { desc: "Pluie modérée", icon: "🌧️" },
                65: { desc: "Pluie forte", icon: "🌧️" },
                80: { desc: "Averses de pluie", icon: "🌦️" },
                81: { desc: "Fortes averses", icon: "🌧️" },
                95: { desc: "Orage", icon: "⛈️" }
            };
            return map[code] || { desc: "Météo variable", icon: "⛅" };
        }

        async function loadData() {
            let sourcesUsed = { air: "Inconnue", pollen: "Inconnue" };
            let weatherData, ecosanteData, nantesData, airplData;

            // 1. Chargement Source A
            try {
                const weatherFetch = fetch(`https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lon}&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Europe%2FParis`);
                const ecosanteFetch = fetch(`https://corsproxy.io/?` + encodeURIComponent(`https://api.ecosante.beta.gouv.fr/v1/indicators/commune/${CONFIG.nantesCommuneCode}?format=json`));
                
                const [resW, resE] = await Promise.all([weatherFetch, ecosanteFetch]);
                weatherData = await resW.json();
                if (resE.ok) ecosanteData = await resE.json();
            } catch(e) { console.error(e); }

            // 2. Chargement Source B
            try {
                const nantesFetch = fetch(`https://data.nantesmetropole.fr/api/explore/v2.1/catalog/datasets/323266205_alerte-pollens-nantes/records?limit=30`);
                const targetAirUrl = 'https://data.airpl.org/api/v1/mesure/journaliere/?code_configuration_de_mesure__code_point_de_prelevement__code_polluant=24&code_configuration_de_mesure__code_point_de_prelevement__code_station__code_commune__code_departement__in=44&limit=1&export=json';
                const airplFetch = fetch('https://corsproxy.io/?' + encodeURIComponent(targetAirUrl));

                const [resN, resA] = await Promise.all([nantesFetch, airplFetch]);
                if (resN.ok) nantesData = await resN.json();
                if (resA.ok) airplData = await resA.json();
            } catch(e) { console.error(e); }

            // ---- TRAITEMENT MÉTÉO ----
            if (weatherData) {
                const currentWeather = getWeatherDetails(weatherData.current.weather_code);
                document.getElementById('main-temp').innerText = `${Math.round(weatherData.current.temperature_2m)}°C`;
                document.getElementById('sub-wind').innerText = `${Math.round(weatherData.current.wind_speed_10m)} km/h`;
                document.getElementById('weather-desc').innerText = currentWeather.desc;
                document.getElementById('main-weather-icon').innerText = currentWeather.icon;
            }

            // ---- QUALITÉ DE L'AIR ----
            const airBadge = document.getElementById('air-badge');
            if (ecosanteData && ecosanteData.data && ecosanteData.data.air && ecosanteData.data.air.value !== null) {
                airBadge.innerText = ecosanteData.data.air.label;
                airBadge.className = `badge level-${ecosanteData.data.air.value}`;
                sourcesUsed.air = "Réseau Éco-Santé (National)";
            } else if (airplData && airplData.results && airplData.results.length > 0 && airplData.results[0].valeur !== null) {
                const val = airplData.results[0].valeur;
                let lvl = 1; if(val > 20) lvl=2; if(val > 40) lvl=3; if(val > 50) lvl=4; if(val > 80) lvl=5;
                airBadge.innerText = `${Math.round(val)} µg/m³`;
                airBadge.className = `badge level-${lvl}`;
                sourcesUsed.air = "Air Pays de la Loire (Capteur Direct)";
            } else {
                airBadge.innerText = "Normal";
                airBadge.className = "badge level-2";
                sourcesUsed.air = "Estimation Climatique";
            }
            document.getElementById('air-source').innerText = `Source : ${sourcesUsed.air}`;

            // ---- ARBITRAGE POLLENS ----
            let risqueBouleau = null; let risqueGraminees = null;

            if (ecosanteData && ecosanteData.data && ecosanteData.data.pollen && ecosanteData.data.pollen.species) {
                ecosanteData.data.pollen.species.forEach(sp => {
                    const label = sp.label.toLowerCase();
                    if (label.includes("bouleau")) risqueBouleau = sp.value;
                    if (label.includes("graminée") || label.includes("poacée")) risqueGraminees = sp.value;
                });
                if (risqueBouleau !== null || risqueGraminees !== null) sourcesUsed.pollen = "RNSA / Éco-Santé";
            }

            if ((risqueBouleau === null || risqueGraminees === null) && nantesData && nantesData.results) {
                sourcesUsed.pollen = "Pollinarium Sentinelle de Nantes";
                nantesData.results.forEach(rec => {
                    const nom = rec.nom_commun ? rec.nom_commun.toLowerCase() : "";
                    const enCours = rec.pret_a_emettre === "En cours";
                    if (nom.includes("bouleau")) risqueBouleau = enCours ? 4 : 1; 
                    if (nom.includes("graminée") || nom.includes("dactyle") || nom.includes("fléole")) {
                        if (enCours) risqueGraminees = 4;
                    }
                });
            }

            if (risqueBouleau === null) risqueBouleau = 0;
            if (risqueGraminees === null) {
                const mois = new Date().getMonth();
                if ((mois === 4 || mois === 5) && weatherData && weatherData.current.temperature_2m > 22) {
                    risqueGraminees = 3;
                    sourcesUsed.pollen = "Modèle Saisonnier Historique";
                } else { risqueGraminees = 0; }
            }

            document.getElementById('pollen-source').innerText = `Source : ${sourcesUsed.pollen}`;
            setupPollenRow('bouleau', risqueBouleau);
            setupPollenRow('graminees', risqueGraminees);

            // ---- PRÉVISIONS ----
            if (weatherData && weatherData.daily) {
                const container = document.getElementById('forecast-container');
                container.innerHTML = "";
                const jours = ["Demain", "Après-demain", "J+3"];
                for (let i = 1; i <= 3; i++) {
                    const max = Math.round(weatherData.daily.temperature_2m_max[i]);
                    const min = Math.round(weatherData.daily.temperature_2m_min[i]);
                    const details = getWeatherDetails(weatherData.daily.weather_code[i]);
                    container.innerHTML += `
                        <div class="forecast-day">
                            <span style="font-weight: 500; width: 110px;">${jours[i-1]}</span>
                            <span style="font-size: 18px; margin-right: 10px;">${details.icon}</span>
                            <span style="color: var(--text-sec); font-size: 14px; flex-grow: 1;">${details.desc}</span>
                            <span style="font-weight: 600;">${max}° / <span style="color: var(--text-sec); font-weight: 400;">${min}°</span></span>
                        </div>`;
                }
            }

            document.getElementById('loader').style.display = 'none';
            document.getElementById('app-content').style.display = 'block';
        }

        function setupPollenRow(id, value) {
            const bar = document.getElementById(`bar-${id}`);
            const txt = document.getElementById(`txt-${id}`);
            const labels = ["Nul", "Très Faible", "Faible", "Modéré", "Fort", "Très Fort"];
            const val = Math.min(Math.max(value, 0), 5);
            
            bar.style.width = `${(val / 5) * 100}%`;
            bar.className = `risk-bar level-${val}`;
            txt.innerText = labels[val];
            txt.className = `badge level-${val}`;
        }

        loadData();
    </script>
</body>
</html>
